name: Run Website Audit Daily

# 設定觸發條件
on:
  schedule:
    # 每天 UTC 時間 20:00 執行（對應台灣時間凌晨 04:00，扣除佇列延遲後約 08:00 產出）
    - cron: '0 18 * * *'
  workflow_dispatch: # 允許您在 GitHub 網站上手動點擊 "Run workflow" 立即測試

# 設定權限，允許 GitHub Actions 寫入（Commit & Push）程式庫
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出程式庫程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. 安裝相依套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. 執行網站檢核與歷史紀錄產生程式
      - name: Run check script
        run: |
          python check_site.py

      # 5. 自動 Commit 並 Push 最新產出的報表與歷史檔案回倉庫
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add index.html history.html audit_history.json
          git commit -m "Auto-update daily audit reports and history archive [skip ci]" || echo "No changes to commit"
          git push
